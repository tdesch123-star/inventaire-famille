<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaire Familial Privé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

  <!-- ExcelJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen relative">
  <div id="app"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA4hz8CgX9UZ25DNzY_BqgAwIWzTTAl248",
      authDomain: "inventaire-famille-552d6.firebaseapp.com",
      databaseURL: "https://inventaire-famille-552d6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventaire-famille-552d6",
      storageBucket: "inventaire-famille-552d6.firebasestorage.app",
      messagingSenderId: "78925408011",
      appId: "1:78925408011:web:ebdbe032908eb385b9a40e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    const USER_AUTH = {
      "Thierry": "Thierry4829",
      "Thierry enfant": "Thierryenfant8241",
      "Loïc": "Loic7315",
      "Loïc enfant": "Loicenfant5913",
      "Grégory": "Gregory9142",
      "Grégory enfant": "Gregoryenfant4628",
      "Manuela": "Manuela6083",
      "Manuela enfant": "Manuelaenfant1759",
      "Jean-Pascal": "Jeanpascal3527",
      "Jean-Pascal enfant": "Jeanpascalenfant8392"
    };

    const PARENTS_LIST = ["Thierry", "Loïc", "Grégory", "Manuela", "Jean-Pascal"];

    const CATEGORIES = [
      "Meuble", 
      "Peinture", 
      "Décoration", 
      "Vaisselle Argenterie", 
      "Vaisselle divers", 
      "Électroménager", 
      "Divers", 
      "Non classé"
    ];
    
    let family = [
      "Thierry", "Thierry enfant",
      "Loïc", "Loïc enfant",
      "Grégory", "Grégory enfant",
      "Manuela", "Manuela enfant",
      "Jean-Pascal", "Jean-Pascal enfant"
    ];

    const CONTROL_PERMISSIONS = {
      "Thierry": ["Thierry", "Thierry enfant"],
      "Thierry enfant": ["Thierry enfant"],
      "Loïc": ["Loïc", "Loïc enfant"],
      "Loïc enfant": ["Loïc enfant"],
      "Grégory": ["Grégory", "Grégory enfant"],
      "Grégory enfant": ["Grégory enfant"],
      "Manuela": ["Manuela", "Manuela enfant"],
      "Manuela enfant": ["Manuela enfant"],
      "Jean-Pascal": ["Jean-Pascal", "Jean-Pascal enfant"],
      "Jean-Pascal enfant": ["Jean-Pascal enfant"]
    };

    const EXCLUDED_ITEMS = [
      "Décoration (6)"
    ];

    const PHOTO_CONFIG = [
      { prefix: "Décoration", count: 75, category: "Décoration" },
      { prefix: "Mobilier", count: 49, category: "Meuble" },
      { prefix: "Vaisselle-Argenterie", count: 64, category: "Vaisselle Argenterie" },
      { prefix: "Divers", count: 38, category: "Divers" },
      { prefix: "Peinture", count: 27, category: "Peinture" },
      { prefix: "Vaisselle divers", count: 20, category: "Vaisselle divers" },
      { prefix: "Electromenager", count: 8, category: "Électroménager" }
    ];

    let items = [];
    let currentUser = null;
    let authError = "";
    let activeFilterCategory = "Tous";
    let activeFilterMember = "Tous";
    let lightboxIndex = null;
    let editingCategoryItemId = null;
    let commentsModalItemId = null;
    let isExporting = false;

    const PLACEHOLDER_IMG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'><rect width='200' height='200' fill='%231e293b'/><text x='50%25' y='45%25' dominant-baseline='middle' text-anchor='middle' fill='%2364748b' font-size='13' font-family='sans-serif'>Image introuvable</text><text x='50%25' y='60%25' dominant-baseline='middle' text-anchor='middle' fill='%23475569' font-size='10' font-family='sans-serif'>Vérifier le nom sur GitHub</text></svg>";

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildInventory() {
      items = [];

      PHOTO_CONFIG.forEach(series => {
        for (let i = 1; i <= series.count; i++) {
          const fileNameBase = `${series.prefix} (${i})`;

          if (EXCLUDED_ITEMS.includes(fileNameBase)) {
            continue;
          }

          const cleanPrefix = series.prefix.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
          const altPrefixBase = `${cleanPrefix} (${i})`;
          const meublePrefixBase = series.prefix === "Mobilier" ? `Meuble (${i})` : fileNameBase;

          const uniqueId = `item_${series.prefix.replace(/[^a-zA-Z0-9]/g, '')}_${i}`;
          
          const imageVariants = [
            `${encodeURIComponent(fileNameBase)}.JPG`,
            `${encodeURIComponent(fileNameBase)}.jpg`,
            `${encodeURIComponent(fileNameBase)}.jpeg`,
            `${encodeURIComponent(altPrefixBase)}.JPG`,
            `${encodeURIComponent(altPrefixBase)}.jpg`,
            `${encodeURIComponent(meublePrefixBase)}.JPG`,
            `${encodeURIComponent(meublePrefixBase)}.jpg`,
            `${encodeURIComponent(fileNameBase)}.png`
          ];

          items.push({
            id: uniqueId,
            name: fileNameBase,
            variants: imageVariants,
            url: imageVariants[0],
            category: series.category,
            availableLater: false,
            reservedFratrie: false,
            deleted: false,
            interests: [],
            comments: []
          });
        }
      });
    }

    function handleImageError(imgElement, itemId) {
      const item = items.find(i => i.id === itemId);
      if (!item) return;

      if (imgElement.dataset.variantIndex === undefined) {
        imgElement.dataset.variantIndex = "0";
      }

      let currentIndex = parseInt(imgElement.dataset.variantIndex, 10) + 1;

      if (currentIndex < item.variants.length) {
        imgElement.dataset.variantIndex = currentIndex.toString();
        imgElement.src = item.variants[currentIndex];
      } else {
        imgElement.onerror = null;
        imgElement.src = PLACEHOLDER_IMG;
      }
    }

    function startFirebaseAuthAndSync() {
      auth.signInAnonymously()
        .then(() => {
          initRealtimeSync();
        })
        .catch((error) => {
          console.error("Erreur d'authentification Firebase :", error);
        });
    }

    function initRealtimeSync() {
      db.ref('inventory').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          items.forEach(item => {
            if (data[item.id]) {
              item.interests = data[item.id].interests || [];
              item.availableLater = data[item.id].availableLater || false;
              item.reservedFratrie = data[item.id].reservedFratrie || false;
              item.deleted = data[item.id].deleted || false;
              item.comments = data[item.id].comments || [];
              if (data[item.id].category) item.category = data[item.id].category;
            }
          });
          render();
        }
      });
    }

    function saveItemState(item) {
      db.ref('inventory/' + item.id).set({
        interests: item.interests || [],
        availableLater: !!item.availableLater,
        reservedFratrie: !!item.reservedFratrie,
        deleted: !!item.deleted,
        category: item.category,
        comments: item.comments || []
      });
    }

    function deleteItem(id) {
      if (currentUser !== "Thierry") return;
      const item = items.find(i => i.id === id);
      if (item && confirm(`Voulez-vous vraiment supprimer "${item.name}" de l'inventaire ?`)) {
        item.deleted = true;
        saveItemState(item);
      }
    }

    function checkSavedAuth() {
      try {
        const savedUser = localStorage.getItem('inv_user');
        const savedPass = localStorage.getItem('inv_pass');
        
        if (savedUser && savedPass && USER_AUTH[savedUser] === savedPass) {
          currentUser = savedUser;
        }
      } catch (e) {
        console.error("Erreur de lecture du localStorage :", e);
      }
    }

    function login(selectedMember, passwordInput, rememberMe = true) {
      authError = "";

      if (USER_AUTH[selectedMember] && passwordInput === USER_AUTH[selectedMember]) {
        currentUser = selectedMember;
        if (rememberMe) {
          try {
            localStorage.setItem('inv_user', selectedMember);
            localStorage.setItem('inv_pass', passwordInput);
          } catch (e) {
            console.error("Erreur de sauvegarde localStorage :", e);
          }
        } else {
          localStorage.removeItem('inv_user');
          localStorage.removeItem('inv_pass');
        }
        render();
      } else {
        authError = "Mot de passe incorrect pour " + selectedMember;
        render();
      }
    }

    function logout() {
      currentUser = null;
      try {
        localStorage.removeItem('inv_user');
        localStorage.removeItem('inv_pass');
      } catch (e) {}
      render();
    }

    function canControl(targetMember) {
      if (!currentUser) return false;
      if (currentUser === "Thierry") return true;
      const allowedTargets = CONTROL_PERMISSIONS[currentUser] || [currentUser];
      return allowedTargets.includes(targetMember);
    }

    function isParent(user) {
      return PARENTS_LIST.includes(user);
    }

    function toggleAvailableLater(id) {
      if (currentUser !== "Thierry") return;
      const item = items.find(i => i.id === id);
      if (item) {
        item.availableLater = !item.availableLater;
        saveItemState(item);
      }
    }

    function toggleReservedFratrie(id) {
      if (!isParent(currentUser)) return;
      const item = items.find(i => i.id === id);
      if (item) {
        item.reservedFratrie = !item.reservedFratrie;
        saveItemState(item);
      }
    }

    function toggleInterest(id, member) {
      if (!canControl(member)) return;
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (item.interests.includes(member)) {
        item.interests = item.interests.filter(m => m !== member);
      } else {
        item.interests.push(member);
      }
      saveItemState(item);
    }

    function openCategoryModal(id) {
      if (currentUser !== "Thierry") return;
      editingCategoryItemId = id;
      render();
    }

    function closeCategoryModal() {
      editingCategoryItemId = null;
      render();
    }

    function selectCategory(cat) {
      if (currentUser !== "Thierry") return;
      const item = items.find(i => i.id === editingCategoryItemId);
      if (item) {
        item.category = cat;
        saveItemState(item);
      }
      editingCategoryItemId = null;
      render();
    }

    function openCommentsModal(id) {
      commentsModalItemId = id;
      render();
    }

    function closeCommentsModal() {
      commentsModalItemId = null;
      render();
    }

    function addComment(itemId, text) {
      if (!text.trim() || !currentUser) return;
      const item = items.find(i => i.id === itemId);
      if (item) {
        if (!item.comments) item.comments = [];
        item.comments.push({
          author: currentUser,
          text: text.trim(),
          date: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
        });
        saveItemState(item);
        render();
      }
    }

    function deleteComment(itemId, commentIdx) {
      const item = items.find(i => i.id === itemId);
      if (item && item.comments && item.comments[commentIdx]) {
        const comm = item.comments[commentIdx];
        if (currentUser === "Thierry" || currentUser === comm.author) {
          item.comments.splice(commentIdx, 1);
          saveItemState(item);
          render();
        }
      }
    }

    async function fetchImageBuffer(variants = []) {
      for (const u of variants) {
        try {
          const res = await fetch(u);
          if (res.ok) {
            const blob = await res.blob();
            const arrayBuffer = await blob.arrayBuffer();
            let ext = 'jpeg';
            if (u.toLowerCase().endsWith('.png')) ext = 'png';
            return { buffer: arrayBuffer, extension: ext };
          }
        } catch (e) {}
      }
      return null;
    }

    async function exportExcelWithImages() {
      const userIsParent = isParent(currentUser);
      const activeItems = items.filter(i => !i.deleted && (userIsParent || !i.reservedFratrie));
      if (activeItems.length === 0) return alert("Aucun objet à exporter.");

      isExporting = true;
      render();

      try {
        const workbook = new ExcelJS.Workbook();
        const worksheet = workbook.addWorksheet("Inventaire");

        const headers = ["Vignette", "Nom de l'objet", "Catégorie", "Aux Orchidées", "Réservé Fratrie", "Nombre d'intéressés", ...family, "Commentaires"];

        worksheet.columns = headers.map((header, idx) => {
          if (idx === 0) return { header, key: "image", width: 14 };
          if (header === "Commentaires") return { header, key: "comments", width: 35 };
          return {
            header,
            key: `col_${idx}`,
            width: Math.max(header.length + 6, 12)
          };
        });

        const headerRow = worksheet.getRow(1);
        headerRow.font = { bold: true, color: { argb: 'FFFFFF' } };
        headerRow.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '1E293B' } };
        headerRow.alignment = { vertical: 'middle', horizontal: 'center' };
        headerRow.height = 25;

        worksheet.views = [
          { state: 'frozen', xSplit: 1, ySplit: 1 }
        ];

        for (let index = 0; index < activeItems.length; index++) {
          const item = activeItems[index];
          const rowIndex = index + 2;
          const row = worksheet.getRow(rowIndex);
          row.height = 55;

          row.getCell(2).value = item.name;
          row.getCell(3).value = item.category;
          row.getCell(4).value = item.availableLater ? "Oui" : "Non";
          row.getCell(5).value = item.reservedFratrie ? "Oui" : "Non";
          row.getCell(6).value = item.interests.length;

          family.forEach((member, mIdx) => {
            row.getCell(7 + mIdx).value = item.interests.includes(member) ? "Oui" : "";
            row.getCell(7 + mIdx).alignment = { vertical: 'middle', horizontal: 'center' };
          });

          const commentsTxt = (item.comments || []).map(c => `[${c.author}] ${c.text}`).join(' | ');
          row.getCell(7 + family.length).value = commentsTxt;
          row.getCell(7 + family.length).alignment = { vertical: 'middle', wrapText: true };

          row.getCell(2).alignment = { vertical: 'middle' };
          row.getCell(3).alignment = { vertical: 'middle' };
          row.getCell(4).alignment = { vertical: 'middle', horizontal: 'center' };
          row.getCell(5).alignment = { vertical: 'middle', horizontal: 'center' };
          row.getCell(6).alignment = { vertical: 'middle', horizontal: 'center' };

          const imgData = await fetchImageBuffer(item.variants);
          if (imgData) {
            const imageId = workbook.addImage({
              buffer: imgData.buffer,
              extension: imgData.extension
            });
            worksheet.addImage(imageId, {
              tl: { col: 0.1, row: rowIndex - 1 + 0.1 },
              ext: { width: 60, height: 60 }
            });
          }
        }

        const lastColLetter = String.fromCharCode(65 + worksheet.columns.length - 1);
        worksheet.autoFilter = `A1:${lastColLetter}${activeItems.length + 1}`;

        const buffer = await workbook.xlsx.writeBuffer();
        const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `synthese_inventaire_famille_${new Date().toISOString().slice(0,10)}.xlsx`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      } catch (err) {
        console.error("Erreur lors de la génération Excel :", err);
        alert("Erreur lors de la génération du fichier Excel.");
      } finally {
        isExporting = false;
        render();
      }
    }

    function render() {
      const app = document.getElementById('app');

      if (!currentUser) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full space-y-6 shadow-2xl text-center">
              <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto text-amber-400 text-2xl">
                <i class="fa-solid fa-lock"></i>
              </div>
              <div>
                <h1 class="text-2xl font-bold text-slate-100">Accès Sécurisé Familial</h1>
                <p class="text-xs text-slate-400 mt-1">Choisissez votre nom et saisissez votre mot de passe privé.</p>
              </div>

              ${authError ? `
                <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-lg font-medium">
                  ${authError}
                </div>
              ` : ''}

              <form onsubmit="event.preventDefault(); login(document.getElementById('memberSelect').value, document.getElementById('passInput').value, document.getElementById('rememberInput').checked);" class="space-y-4 text-left">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Identifiant :</label>
                  <select id="memberSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-xl p-3 focus:outline-none focus:border-amber-500">
                    ${family.map(m => `<option value="${m}">${m}</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Mot de passe individuel :</label>
                  <input type="password" id="passInput" placeholder="Entrez votre mot de passe" required class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-xl p-3 focus:outline-none focus:border-amber-500">
                </div>

                <div class="flex items-center gap-2">
                  <input type="checkbox" id="rememberInput" checked class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
                  <label for="rememberInput" class="text-xs text-slate-300 cursor-pointer">Rester connecté sur cet appareil</label>
                </div>

                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                  <i class="fa-solid fa-right-to-bracket"></i> Se connecter
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      const userIsParent = isParent(currentUser);

      const activeItems = items.filter(i => !i.deleted && (userIsParent || !i.reservedFratrie));

      const filteredItems = activeItems.filter(item => {
        let matchCategory = false;
        if (activeFilterCategory === 'Tous') {
          matchCategory = true;
        } else if (activeFilterCategory === 'DISPO_LATER') {
          matchCategory = item.availableLater;
        } else if (activeFilterCategory === 'RESERVED_FRATRIE') {
          matchCategory = item.reservedFratrie;
        } else {
          matchCategory = (item.category === activeFilterCategory);
        }

        const matchMember = (activeFilterMember === 'Tous' || item.interests.includes(activeFilterMember));
        return matchCategory && matchMember;
      });

      const dispoLaterCount = activeItems.filter(i => i.availableLater).length;
      const reservedFratrieCount = activeItems.filter(i => i.reservedFratrie).length;
      const commentsModalItem = commentsModalItemId ? items.find(i => i.id === commentsModalItemId) : null;

      app.innerHTML = `
        <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 p-3 shadow-lg">
          <div class="max-w-[1600px] mx-auto flex flex-wrap justify-between items-center gap-3">
            <div>
              <h1 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-boxes-packing mr-2"></i>Catalogue de Famille</h1>
              <p class="text-[11px] text-slate-400">${activeItems.length} objet(s) au total ${activeFilterMember !== 'Tous' || activeFilterCategory !== 'Tous' ? `— <b class="text-amber-300">${filteredItems.length} affiché(s)</b>` : ''}</p>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
              <div class="bg-slate-900 border border-amber-500/30 px-2.5 py-1 rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-user text-amber-400 text-xs"></i>
                <span class="text-xs font-semibold text-slate-200">${currentUser}</span>
                <button onclick="logout()" title="Déconnexion" class="ml-1 text-[10px] text-slate-400 hover:text-rose-400 underline">Déconnexion</button>
              </div>

              ${activeItems.length > 0 ? `
                <button onclick="exportExcelWithImages()" ${isExporting ? 'disabled' : ''} class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow disabled:opacity-50">
                  <i class="fa-solid ${isExporting ? 'fa-spinner fa-spin' : 'fa-file-excel'}"></i>
                  <span>${isExporting ? 'Génération...' : 'Extraire la synthèse (Excel)'}</span>
                </button>
              ` : ''}
            </div>
          </div>
        </header>

        <main class="max-w-[1600px] mx-auto p-3 space-y-4 pb-20">
          <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/80 flex flex-wrap items-center gap-2 shadow">
            <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1">
              <i class="fa-solid fa-eye"></i> Consulter les choix de :
            </span>
            <button onclick="setMemberFilter('Tous')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${activeFilterMember === 'Tous' ? 'bg-amber-500 text-slate-900 shadow' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
              Voir tout le monde
            </button>
            ${family.map(f => {
              const count = activeItems.filter(i => i.interests.includes(f)).length;
              const isActive = activeFilterMember === f;
              const isChild = f.includes("enfant");
              return `
                <button onclick="setMemberFilter('${f}')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition flex items-center gap-1 ${isActive ? 'bg-emerald-500 text-slate-950 font-bold shadow' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'} ${isChild ? 'border border-dashed border-amber-400/40' : ''}">
                  <span>${f}</span>
                  <span class="px-1.5 py-0.2 text-[10px] rounded-full ${isActive ? 'bg-slate-950/30 text-slate-950' : 'bg-slate-800 text-slate-400'}">${count}</span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="flex flex-wrap items-center gap-1.5 pb-2 border-b border-slate-800">
            <span class="text-xs text-slate-400 font-semibold mr-1">Filtre :</span>
            <button onclick="setCategoryFilter('Tous')" class="px-2.5 py-1 rounded-full text-xs font-semibold ${activeFilterCategory === 'Tous' ? 'bg-amber-500 text-slate-900 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Toutes</button>
            
            ${CATEGORIES.map(c => `
              <button onclick="setCategoryFilter('${c}')" class="px-2.5 py-1 rounded-full text-xs font-semibold ${activeFilterCategory === c ? 'bg-amber-500 text-slate-900 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${c}</button>
            `).join('')}

            <button onclick="setCategoryFilter('DISPO_LATER')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition flex items-center gap-1 ${activeFilterCategory === 'DISPO_LATER' ? 'bg-yellow-300 text-slate-950 font-bold shadow' : 'bg-yellow-300/10 text-yellow-300 border border-yellow-300/30 hover:bg-yellow-300/20'}">
              <span>🟡 Aux Orchidées</span>
              <span class="px-1.5 py-0.2 text-[10px] rounded-full ${activeFilterCategory === 'DISPO_LATER' ? 'bg-slate-950/30 text-slate-950' : 'bg-yellow-300/20 text-yellow-300'}">${dispoLaterCount}</span>
            </button>

            ${userIsParent ? `
              <button onclick="setCategoryFilter('RESERVED_FRATRIE')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition flex items-center gap-1 ${activeFilterCategory === 'RESERVED_FRATRIE' ? 'bg-rose-500 text-slate-950 font-bold shadow' : 'bg-rose-500/10 text-rose-400 border border-rose-500/30 hover:bg-rose-500/20'}">
                <span>🔴 Réservé Fratrie</span>
                <span class="px-1.5 py-0.2 text-[10px] rounded-full ${activeFilterCategory === 'RESERVED_FRATRIE' ? 'bg-slate-950/30 text-slate-950' : 'bg-rose-500/20 text-rose-300'}">${reservedFratrieCount}</span>
              </button>
            ` : ''}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
            ${filteredItems.map((item) => {
              const hasComments = item.comments && item.comments.length > 0;
              const commentCount = hasComments ? item.comments.length : 0;

              return `
                <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700/60 shadow flex flex-col relative group">
                  <div class="relative aspect-square bg-slate-950/80 overflow-hidden cursor-pointer p-1" onclick="openLightboxByItem('${item.id}')">
                    <img 
                      src="${item.variants[0]}" 
                      loading="lazy" 
                      decoding="async" 
                      onerror="handleImageError(this, '${item.id}')" 
                      class="w-full h-full object-contain group-hover:scale-105 transition duration-300"
                    >
                    
                    <div class="absolute top-2 right-2 z-10 flex items-center gap-1">
                      ${item.availableLater ? `
                        <div class="flex items-center justify-center" title="Aux Orchidées">
                          <span class="relative flex h-10 w-10">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-300 opacity-80"></span>
                            <span class="relative inline-flex rounded-full h-10 w-10 bg-yellow-300 border-2 border-slate-950 shadow-[0_0_15px_#fde047]"></span>
                          </span>
                        </div>
                      ` : ''}

                      ${item.reservedFratrie ? `
                        <div class="flex items-center justify-center" title="Réservé Fratrie">
                          <span class="relative flex h-10 w-10">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-500 opacity-80"></span>
                            <span class="relative inline-flex rounded-full h-10 w-10 bg-rose-500 border-2 border-slate-950 shadow-[0_0_15px_#f43f5e]"></span>
                          </span>
                        </div>
                      ` : ''}
                    </div>
                  </div>

                  <div class="p-2.5 flex-1 flex flex-col justify-between space-y-2">
                    <div>
                      <div class="flex justify-between items-center gap-1 mb-1.5">
                        <span class="text-[11px] font-semibold text-amber-400 bg-amber-400/10 border border-amber-400/20 px-1.5 py-0.5 rounded truncate">${item.category}</span>
                        
                        <div class="flex items-center gap-1 flex-wrap justify-end">
                          <button 
                            onclick="openCommentsModal('${item.id}')" 
                            class="text-[9px] font-bold px-1.5 py-0.5 rounded transition flex items-center gap-1 border ${
                              hasComments 
                                ? 'bg-purple-600 hover:bg-purple-500 text-white border-purple-400 shadow-[0_0_10px_rgba(168,85,247,0.5)]' 
                                : 'bg-slate-700/60 hover:bg-purple-600 hover:text-white text-slate-300 border-slate-600/50'
                            }"
                            title="Ajouter ou voir des remarques"
                          >
                            <i class="fa-solid fa-comment"></i>
                            <span>${hasComments ? commentCount : 'Remarque'}</span>
                          </button>

                          ${userIsParent ? `
                            <button 
                              onclick="toggleReservedFratrie('${item.id}')" 
                              class="text-[9px] font-bold px-1 py-0.5 rounded transition flex items-center gap-1 border ${
                                item.reservedFratrie 
                                  ? 'bg-rose-600 hover:bg-rose-500 text-white border-rose-400 shadow' 
                                  : 'bg-slate-700/60 hover:bg-rose-600 hover:text-white text-slate-300 border-slate-600/50'
                              }"
                              title="Réserver à la Fratrie uniquement"
                            >
                              <i class="fa-solid fa-user-lock"></i>
                              <span>Fratrie</span>
                            </button>
                          ` : ''}

                          ${currentUser === "Thierry" ? `
                            <button 
                              onclick="toggleAvailableLater('${item.id}')" 
                              class="text-[9px] font-bold px-1 py-0.5 rounded transition flex items-center gap-1 border ${
                                item.availableLater 
                                  ? 'bg-rose-600 hover:bg-rose-500 text-white border-rose-500 shadow' 
                                  : 'bg-slate-700/60 hover:bg-rose-600 hover:text-white text-slate-300 border-slate-600/50'
                              }"
                              title="Indiquer Aux Orchidées"
                            >
                              <i class="fa-solid fa-clock"></i>
                              <span>Aux Orchidées</span>
                            </button>

                            <button 
                              onclick="openCategoryModal('${item.id}')" 
                              class="bg-slate-700/80 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-[9px] font-medium px-1 py-0.5 rounded transition flex items-center gap-1 border border-slate-600/50"
                              title="Changer la catégorie"
                            >
                              <i class="fa-solid fa-pen-to-square"></i>
                              <span>Changer</span>
                            </button>

                            <!-- Bouton Supprimer exclusif pour Thierry -->
                            <button 
                              onclick="deleteItem('${item.id}')" 
                              class="bg-rose-950/60 hover:bg-rose-600 text-rose-300 hover:text-white text-[9px] font-bold px-1.5 py-0.5 rounded transition flex items-center gap-1 border border-rose-800/50"
                              title="Supprimer cet objet de l'inventaire"
                            >
                              <i class="fa-solid fa-trash-can"></i>
                              <span>Supprimer</span>
                            </button>
                          ` : ''}
                        </div>
                      </div>
                      <p class="text-[11px] text-slate-400 font-mono truncate" title="${item.name}">${item.name}</p>
                    </div>

                    <div class="space-y-1 border-t border-slate-700/50 pt-1.5">
                      <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Intéressé(e)s :</p>
                      <div class="flex flex-wrap gap-1">
                        ${family.map(m => {
                          const interested = item.interests.includes(m);
                          const hasPermission = canControl(m);
                          
                          return `
                            <button 
                              ${hasPermission ? `onclick="toggleInterest('${item.id}', '${m}')"` : 'disabled'} 
                              class="text-[10px] px-1.5 py-0.5 rounded transition flex items-center gap-0.5 ${
                                interested 
                                  ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-semibold' 
                                  : 'bg-slate-700/30 text-slate-500 border border-transparent'
                              } ${
                                hasPermission 
                                  ? 'cursor-pointer ring-1 ring-amber-400/50 hover:bg-emerald-500/30' 
                                  : 'cursor-not-allowed opacity-50'
                              }"
                            >
                              ${interested ? '✓ ' : ''}${m}
                            </button>
                          `;
                        }).join('')}
                      </div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- Bouton de fin de liste -->
          <div class="pt-8 pb-4 flex justify-center">
            <button onclick="scrollToTop()" class="px-5 py-2.5 bg-slate-800 hover:bg-amber-500 text-slate-300 hover:text-slate-950 font-bold text-xs rounded-xl border border-slate-700 transition flex items-center gap-2 shadow-lg">
              <i class="fa-solid fa-arrow-up"></i>
              <span>Remonter en haut de page</span>
            </button>
          </div>
        </main>

        <!-- Bouton Flottant fixe en bas à droite -->
        <button 
          onclick="scrollToTop()" 
          title="Remonter en haut"
          class="fixed bottom-6 right-6 z-40 bg-amber-500 hover:bg-amber-400 text-slate-950 w-12 h-12 rounded-full shadow-2xl flex items-center justify-center transition transform hover:scale-110 active:scale-95 border border-amber-300/50"
        >
          <i class="fa-solid fa-arrow-up text-lg font-bold"></i>
        </button>

        <!-- Modale Catégorie (Thierry) -->
        ${editingCategoryItemId !== null && currentUser === "Thierry" ? `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeCategoryModal()">
            <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl" onclick="event.stopPropagation()">
              <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                  <i class="fa-solid fa-list"></i> Changer de catégorie
                </h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="grid grid-cols-1 gap-2">
                ${CATEGORIES.map(c => `
                  <button onclick="selectCategory('${c}')" class="w-full text-left px-3 py-2 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs font-semibold transition border border-slate-700/60 flex items-center justify-between">
                    <span>${c}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        ` : ''}

        <!-- Modale Commentaires -->
        ${commentsModalItem ? `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeCommentsModal()">
            <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
              <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-purple-400 flex items-center gap-2 truncate">
                  <i class="fa-solid fa-comments"></i> Remarques : ${commentsModalItem.name}
                </h3>
                <button onclick="closeCommentsModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
              </div>

              <!-- Liste des remarques -->
              <div class="flex-1 overflow-y-auto space-y-3 pr-1">
                ${(!commentsModalItem.comments || commentsModalItem.comments.length === 0) ? `
                  <p class="text-xs text-slate-500 italic text-center py-4">Aucune remarque ajoutée pour l'instant.</p>
                ` : commentsModalItem.comments.map((comm, cIdx) => `
                  <div class="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3 text-xs space-y-1 relative group">
                    <div class="flex justify-between items-center text-[10px] text-slate-400 border-b border-slate-700/40 pb-1">
                      <span class="font-bold text-amber-400">${comm.author}</span>
                      <div class="flex items-center gap-2">
                        <span>${comm.date || ''}</span>
                        ${(currentUser === "Thierry" || currentUser === comm.author) ? `
                          <button onclick="deleteComment('${commentsModalItem.id}',${cIdx})" class="text-rose-400 hover:text-rose-300" title="Supprimer"><i class="fa-solid fa-trash-can"></i></button>
                        ` : ''}
                      </div>
                    </div>
                    <p class="text-slate-200 pt-1 leading-relaxed">${comm.text}</p>
                  </div>
                `).join('')}
              </div>

              <!-- Formulaire d'ajout -->
              <form onsubmit="event.preventDefault(); addComment('${commentsModalItem.id}', document.getElementById('newCommentInput').value); document.getElementById('newCommentInput').value='';" class="space-y-2 pt-2 border-t border-slate-800">
                <label class="block text-[11px] text-slate-400 font-semibold">Ajouter une précision (${currentUser}) :</label>
                <div class="flex gap-2">
                  <input type="text" id="newCommentInput" placeholder="Ex: Je suis preneur si personne ne le veut..." required class="flex-1 bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-xl p-2.5 focus:outline-none focus:border-purple-500">
                  <button type="submit" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-4 rounded-xl transition shadow flex items-center gap-1">
                    <i class="fa-solid fa-paper-plane"></i>
                  </button>
                </div>
              </form>
            </div>
          </div>
        ` : ''}

        <!-- Lightbox -->
        ${lightboxIndex !== null && items[lightboxIndex] ? `
          <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4" onclick="closeLightbox()">
            <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
              <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white text-2xl hover:text-amber-400"><i class="fa-solid fa-xmark"></i></button>
              <img src="${items[lightboxIndex].variants[0]}" onerror="handleImageError(this, '${items[lightboxIndex].id}')" class="max-h-[80vh] max-w-full object-contain rounded-lg">
              <p class="text-slate-300 text-sm mt-3 font-medium">${items[lightboxIndex].name} — <span class="text-amber-400">${items[lightboxIndex].category}</span></p>
            </div>
          </div>
        ` : ''}
      `;
    }

    function setCurrentUser(user) { currentUser = user; render(); }
    function setCategoryFilter(cat) { activeFilterCategory = cat; render(); }
    function setMemberFilter(member) { activeFilterMember = member; render(); }

    function openLightboxByItem(id) { lightboxIndex = items.findIndex(i => i.id === id); render(); }
    function closeLightbox() { lightboxIndex = null; render(); }

    buildInventory();
    checkSavedAuth();
    startFirebaseAuthAndSync();
    render();
  </script>
</body>
</html>
