<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaire Familial Privé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app"></div>
  <script>
    const CATEGORIES = ["Meuble", "Peinture-Gravure", "Décoration", "Vaisselle Argenterie", "Vaisselle divers", "Électroménager", "Divers", "Non classé"];
    
    let family = [
      "Thierry", "Thierry enfant",
      "Loïc", "Loïc enfant",
      "Grégory", "Grégory enfant",
      "Manuela", "Manuela enfant",
      "Jean-Pascal", "Jean-Pascal enfant"
    ];

    const PARENT_CHILD_MAP = {
      "Thierry": ["Thierry", "Thierry enfant"],
      "Loïc": ["Loïc", "Loïc enfant"],
      "Grégory": ["Grégory", "Grégory enfant"],
      "Manuela": ["Manuela", "Manuela enfant"],
      "Jean-Pascal": ["Jean-Pascal", "Jean-Pascal enfant"]
    };

    const PHOTO_SERIES = [
      { prefix: "Décoration", max: 120, category: "Décoration" },
      { prefix: "Mobilier", max: 120, category: "Meuble" },
      { prefix: "Meuble", max: 120, category: "Meuble" },
      { prefix: "Peinture-Gravure", max: 120, category: "Peinture-Gravure" },
      { prefix: "Tableau", max: 120, category: "Peinture-Gravure" },
      { prefix: "Vaisselle-Argenterie", max: 120, category: "Vaisselle Argenterie" },
      { prefix: "Vaisselle divers", max: 120, category: "Vaisselle divers" },
      { prefix: "Electromenager", max: 120, category: "Électroménager" },
      { prefix: "Divers", max: 120, category: "Divers" }
    ];

    let items = [];
    let currentUser = null;
    let activeFilterCategory = "Tous";
    let activeFilterMember = "Tous";
    let lightboxIndex = null;
    let editingCategoryItemId = null;

    function loadLocalImages() {
      let idCounter = 1;
      const extensions = ["JPG", "jpg", "jpeg", "PNG", "png"];

      PHOTO_SERIES.forEach(series => {
        for (let i = 1; i <= series.max; i++) {
          extensions.forEach(ext => {
            const fileName = `${series.prefix} (${i}).${ext}`;
            // Recherche directement à la racine (plus de dossier images/)
            const imgPath = fileName;
            const baseKey = `${series.prefix}_${i}`.toLowerCase();

            const img = new Image();
            img.src = imgPath;
            img.onload = function() {
              const alreadyExists = items.some(item => item.key === baseKey);
              if (!alreadyExists) {
                items.push({
                  id: idCounter++,
                  key: baseKey,
                  name: fileName,
                  url: imgPath,
                  category: series.category,
                  interests: []
                });
                render();
              }
            };
          });
        }
      });
    }

    function canControl(targetMember) {
      if (!currentUser) return false;
      if (currentUser === targetMember) return true;
      if (PARENT_CHILD_MAP[currentUser] && PARENT_CHILD_MAP[currentUser].includes(targetMember)) {
        return true;
      }
      return false;
    }

    function render() {
      const app = document.getElementById('app');

      if (!currentUser) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full text-center space-y-6 shadow-2xl">
              <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto text-amber-400 text-2xl">
                <i class="fa-solid fa-users"></i>
              </div>
              <div>
                <h1 class="text-2xl font-bold text-slate-100">Catalogue Familial</h1>
                <p class="text-xs text-slate-400 mt-1">Qui êtes-vous ? Choisissez votre prénom pour continuer.</p>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[60vh] overflow-y-auto p-1">
                ${family.map(m => `
                  <button onclick="setCurrentUser('${m}')" class="w-full py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-amber-500 hover:text-slate-950 border border-slate-700 font-semibold text-xs transition flex items-center justify-between group">
                    <span class="truncate">${m}</span>
                    <i class="fa-solid fa-chevron-right text-[10px] opacity-50 group-hover:opacity-100 ml-1"></i>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        return;
      }

      const filteredItems = items.filter(item => {
        const matchCategory = (activeFilterCategory === 'Tous' || item.category === activeFilterCategory);
        const matchMember = (activeFilterMember === 'Tous' || item.interests.includes(activeFilterMember));
        return matchCategory && matchMember;
      });

      app.innerHTML = `
        <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 p-4 shadow-lg">
          <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div>
              <h1 class="text-2xl font-bold text-amber-400"><i class="fa-solid fa-boxes-packing mr-2"></i>Catalogue de Famille</h1>
              <p class="text-xs text-slate-400">${items.length} objet(s) au total ${activeFilterMember !== 'Tous' || activeFilterCategory !== 'Tous' ? `— <b class="text-amber-300">${filteredItems.length} affiché(s)</b>` : ''}</p>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
              <div class="bg-slate-900 border border-amber-500/30 px-3 py-1.5 rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-user text-amber-400"></i>
                <span class="text-xs font-semibold text-slate-200">${currentUser}</span>
                <button onclick="setCurrentUser(null)" title="Changer d'utilisateur" class="ml-2 text-[10px] text-slate-400 hover:text-rose-400 underline">Changer</button>
              </div>

              ${items.length > 0 ? `
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-3 py-2 rounded-lg text-xs transition flex items-center gap-1.5 shadow">
                  <i class="fa-solid fa-file-excel"></i>Extraire la synthèse
                </button>
              ` : ''}
            </div>
          </div>
        </header>

        <main class="max-w-7xl mx-auto p-4 space-y-6">
          <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700/80 flex flex-wrap items-center gap-3 shadow">
            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1.5">
              <i class="fa-solid fa-eye"></i> Consulter les choix de :
            </span>
            <button onclick="setMemberFilter('Tous')" class="px-3 py-1.5 rounded-full text-xs font-semibold transition ${activeFilterMember === 'Tous' ? 'bg-amber-500 text-slate-900 shadow' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
              Voir tout le monde
            </button>
            ${family.map(f => {
              const count = items.filter(i => i.interests.includes(f)).length;
              const isActive = activeFilterMember === f;
              const isChild = f.includes("enfant");
              return `
                <button onclick="setMemberFilter('${f}')" class="px-3 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5 ${isActive ? 'bg-emerald-500 text-slate-950 font-bold shadow' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'} ${isChild ? 'border border-dashed border-amber-400/40' : ''}">
                  <span>${f}</span>
                  <span class="px-1.5 py-0.2 text-[10px] rounded-full ${isActive ? 'bg-slate-950/30 text-slate-950' : 'bg-slate-800 text-slate-400'}">${count}</span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="flex flex-wrap items-center gap-2 pb-2 border-b border-slate-800">
            <span class="text-xs text-slate-400 font-semibold mr-1">Catégorie :</span>
            <button onclick="setCategoryFilter('Tous')" class="px-3 py-1.5 rounded-full text-xs font-semibold ${activeFilterCategory === 'Tous' ? 'bg-amber-500 text-slate-900 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Toutes</button>
            ${CATEGORIES.map(c => `
              <button onclick="setCategoryFilter('${c}')" class="px-3 py-1.5 rounded-full text-xs font-semibold ${activeFilterCategory === c ? 'bg-amber-500 text-slate-900 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${c}</button>
            `).join('')}
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            ${filteredItems.map((item) => `
              <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700/60 shadow-lg flex flex-col relative group">
                <div class="relative aspect-square bg-slate-950 overflow-hidden cursor-pointer" onclick="openLightboxByItem(${item.id})">
                  <img src="${item.url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy">
                </div>

                <div class="p-3 flex-1 flex flex-col justify-between space-y-3">
                  <div>
                    <div class="flex justify-between items-center gap-2 mb-2">
                      <span class="text-xs font-semibold text-amber-400 bg-amber-400/10 border border-amber-400/20 px-2 py-0.5 rounded truncate">${item.category}</span>
                      <button onclick="openCategoryModal(${item.id})" class="bg-slate-700/80 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-[11px] font-medium px-2 py-1 rounded transition flex items-center gap-1 border border-slate-600/50">
                        <i class="fa-solid fa-pen-to-square"></i>
                        <span>Changer</span>
                      </button>
                    </div>
                    <p class="text-xs text-slate-400 font-mono truncate" title="${item.name}">${item.name}</p>
                  </div>

                  <div class="space-y-2 border-t border-slate-700/50 pt-2">
                    <p class="text-[10px] uppercase tracking-wider text-slate-400 font-bold">Intéressé(e)s :</p>
                    <div class="flex flex-wrap gap-1">
                      ${family.map(m => {
                        const interested = item.interests.includes(m);
                        const hasPermission = canControl(m);
                        
                        return `
                          <button 
                            ${hasPermission ? `onclick="toggleInterest(${item.id}, '${m}')"` : 'disabled'} 
                            class="text-xs px-2 py-0.5 rounded-md transition flex items-center gap-1 ${
                              interested 
                                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-semibold' 
                                : 'bg-slate-700/30 text-slate-500 border border-transparent'
                            } ${
                              hasPermission 
                                ? 'cursor-pointer ring-1 ring-amber-400/50 hover:bg-emerald-500/30' 
                                : 'cursor-not-allowed opacity-50'
                            }"
                          >
                            ${interested ? '✓ ' : ''}${m}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </main>

        <!-- Modale Catégorie -->
        ${editingCategoryItemId !== null ? `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeCategoryModal()">
            <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl" onclick="event.stopPropagation()">
              <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                  <i class="fa-solid fa-list"></i> Changer de catégorie
                </h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="grid grid-cols-1 gap-2">
                ${CATEGORIES.map(c => `
                  <button onclick="selectCategory('${c}')" class="w-full text-left px-3 py-2 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs font-semibold transition border border-slate-700/60 flex items-center justify-between">
                    <span>${c}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        ` : ''}

        <!-- Lightbox -->
        ${lightboxIndex !== null && items[lightboxIndex] ? `
          <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4" onclick="closeLightbox()">
            <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
              <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white text-2xl hover:text-amber-400"><i class="fa-solid fa-xmark"></i></button>
              <img src="${items[lightboxIndex].url}" class="max-h-[80vh] max-w-full object-contain rounded-lg">
              <p class="text-slate-300 text-sm mt-3 font-medium">${items[lightboxIndex].name} — <span class="text-amber-400">${items[lightboxIndex].category}</span></p>
            </div>
          </div>
        ` : ''}
      `;
    }

    function setCurrentUser(user) { currentUser = user; render(); }
    function setCategoryFilter(cat) { activeFilterCategory = cat; render(); }
    function setMemberFilter(member) { activeFilterMember = member; render(); }

    function openLightboxByItem(id) { lightboxIndex = items.findIndex(i => i.id === id); render(); }
    function closeLightbox() { lightboxIndex = null; render(); }

    function openCategoryModal(id) { editingCategoryItemId = id; render(); }
    function closeCategoryModal() { editingCategoryItemId = null; render(); }

    function selectCategory(cat) {
      const item = items.find(i => i.id === editingCategoryItemId);
      if (item) item.category = cat;
      editingCategoryItemId = null;
      render();
    }

    function toggleInterest(id, member) {
      if (!canControl(member)) return;
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (item.interests.includes(member)) {
        item.interests = item.interests.filter(m => m !== member);
      } else {
        item.interests.push(member);
      }
      render();
    }

    function exportCSV() {
      if (items.length === 0) return alert("Aucun objet à exporter.");
      let csvContent = "\uFEFFNom de l'objet;Catégorie;Personnes intéressées;Nombre d'intéressés\n";
      items.forEach(item => {
        const interestedStr = item.interests.length > 0 ? item.interests.join(", ") : "Aucune sélection";
        csvContent += `"${item.name.replace(/"/g, '""')}";"${item.category.replace(/"/g, '""')}";"${interestedStr.replace(/"/g, '""')}";${item.interests.length}\n`;
      });
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `synthese_inventaire_famille_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    loadLocalImages();
    render();
  </script>
</body>
</html>
