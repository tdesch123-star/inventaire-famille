<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventaire Familial Privé</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="app"></div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA4hz8CgX9UZ25DNzY_BqgAwIWzTTAl248",
      authDomain: "inventaire-famille-552d6.firebaseapp.com",
      databaseURL: "https://inventaire-famille-552d6-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "inventaire-famille-552d6",
      storageBucket: "inventaire-famille-552d6.firebasestorage.app",
      messagingSenderId: "78925408011",
      appId: "1:78925408011:web:ebdbe032908eb385b9a40e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Mots de passe personnalisés (Prénom + 4 chiffres aléatoires)
    const FAMILY_AUTH = {
      "Thierry": { password: "Thierry4829", members: ["Thierry", "Thierry enfant"] },
      "Loïc": { password: "Loic7315", members: ["Loïc", "Loïc enfant"] },
      "Grégory": { password: "Gregory9142", members: ["Grégory", "Grégory enfant"] },
      "Manuela": { password: "Manuela6083", members: ["Manuela", "Manuela enfant"] },
      "Jean-Pascal": { password: "Jeanpascal3527", members: ["Jean-Pascal", "Jean-Pascal enfant"] }
    };

    const CATEGORIES = [
      "Meuble", 
      "Peinture", 
      "Décoration", 
      "Vaisselle Argenterie", 
      "Vaisselle divers", 
      "Électroménager", 
      "Divers", 
      "Non classé"
    ];
    
    let family = [
      "Thierry", "Thierry enfant",
      "Loïc", "Loïc enfant",
      "Grégory", "Grégory enfant",
      "Manuela", "Manuela enfant",
      "Jean-Pascal", "Jean-Pascal enfant"
    ];

    const PARENT_CHILD_MAP = {
      "Thierry": ["Thierry", "Thierry enfant"],
      "Loïc": ["Loïc", "Loïc enfant"],
      "Grégory": ["Grégory", "Grégory enfant"],
      "Manuela": ["Manuela", "Manuela enfant"],
      "Jean-Pascal": ["Jean-Pascal", "Jean-Pascal enfant"]
    };

    const PHOTO_CONFIG = [
      { prefix: "Décoration", count: 77, category: "Décoration" },
      { prefix: "Mobilier", count: 70, category: "Meuble" },
      { prefix: "Vaisselle-Argenterie", count: 66, category: "Vaisselle Argenterie" },
      { prefix: "Divers", count: 40, category: "Divers" },
      { prefix: "Peinture", count: 28, category: "Peinture" },
      { prefix: "Vaisselle divers", count: 20, category: "Vaisselle divers" },
      { prefix: "Electromenager", count: 8, category: "Électroménager" }
    ];

    let items = [];
    let currentUser = null;
    let authError = "";
    let activeFilterCategory = "Tous";
    let activeFilterMember = "Tous";
    let lightboxIndex = null;
    let editingCategoryItemId = null;

    function buildInventory() {
      items = [];
      let idCounter = 1;

      PHOTO_CONFIG.forEach(series => {
        for (let i = 1; i <= series.count; i++) {
          const fileNameBase = `${series.prefix} (${i})`;
          
          items.push({
            id: idCounter++,
            name: fileNameBase,
            url: `${encodeURIComponent(fileNameBase)}.JPG`,
            fallbackUrl: `${encodeURIComponent(fileNameBase)}.jpg`,
            fallbackUrl2: `${encodeURIComponent(fileNameBase)}.jpeg`,
            fallbackUrl3: `${encodeURIComponent(fileNameBase)}.png`,
            category: series.category,
            availableLater: false,
            deleted: false,
            interests: []
          });
        }
      });
    }

    function initRealtimeSync() {
      db.ref('inventory').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          items.forEach(item => {
            if (data[item.id]) {
              item.interests = data[item.id].interests || [];
              item.availableLater = data[item.id].availableLater || false;
              item.deleted = data[item.id].deleted || false;
              if (data[item.id].category) item.category = data[item.id].category;
            }
          });
          render();
        }
      });
    }

    function saveItemState(item) {
      db.ref('inventory/' + item.id).set({
        interests: item.interests || [],
        availableLater: !!item.availableLater,
        category: item.category,
        deleted: !!item.deleted
      });
    }

    function login(selectedMember, passwordInput) {
      authError = "";
      let foundGroup = null;
      
      for (const [groupName, groupData] of Object.entries(FAMILY_AUTH)) {
        if (groupData.members.includes(selectedMember)) {
          foundGroup = groupData;
          break;
        }
      }

      if (foundGroup && passwordInput === foundGroup.password) {
        currentUser = selectedMember;
        render();
      } else {
        authError = "Mot de passe incorrect pour " + selectedMember;
        render();
      }
    }

    function deleteItem(id) {
      if (currentUser !== "Thierry") return;
      const item = items.find(i => i.id === id);
      if (item && confirm(`Voulez-vous vraiment supprimer définitivement "${item.name}" ?`)) {
        item.deleted = true;
        saveItemState(item);
      }
    }

    function canControl(targetMember) {
      if (!currentUser) return false;
      if (currentUser === targetMember) return true;
      if (PARENT_CHILD_MAP[currentUser] && PARENT_CHILD_MAP[currentUser].includes(targetMember)) {
        return true;
      }
      return false;
    }

    function toggleAvailableLater(id) {
      if (currentUser !== "Thierry") return;
      const item = items.find(i => i.id === id);
      if (item) {
        item.availableLater = !item.availableLater;
        saveItemState(item);
      }
    }

    function toggleInterest(id, member) {
      if (!canControl(member)) return;
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (item.interests.includes(member)) {
        item.interests = item.interests.filter(m => m !== member);
      } else {
        item.interests.push(member);
      }
      saveItemState(item);
    }

    function openCategoryModal(id) {
      if (currentUser !== "Thierry") return;
      editingCategoryItemId = id;
      render();
    }

    function closeCategoryModal() {
      editingCategoryItemId = null;
      render();
    }

    function selectCategory(cat) {
      if (currentUser !== "Thierry") return;
      const item = items.find(i => i.id === editingCategoryItemId);
      if (item) {
        item.category = cat;
        saveItemState(item);
      }
      editingCategoryItemId = null;
      render();
    }

    function render() {
      const app = document.getElementById('app');

      if (!currentUser) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center p-4 bg-slate-950">
            <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-md w-full space-y-6 shadow-2xl text-center">
              <div class="w-16 h-16 bg-amber-500/10 border border-amber-500/30 rounded-full flex items-center justify-center mx-auto text-amber-400 text-2xl">
                <i class="fa-solid fa-lock"></i>
              </div>
              <div>
                <h1 class="text-2xl font-bold text-slate-100">Accès Sécurisé Familial</h1>
                <p class="text-xs text-slate-400 mt-1">Choisissez votre nom et saisissez votre mot de passe privé.</p>
              </div>

              ${authError ? `
                <div class="bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs p-3 rounded-lg font-medium">
                  ${authError}
                </div>
              ` : ''}

              <form onsubmit="event.preventDefault(); login(document.getElementById('memberSelect').value, document.getElementById('passInput').value);" class="space-y-4 text-left">
                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Identifiant :</label>
                  <select id="memberSelect" class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-xl p-3 focus:outline-none focus:border-amber-500">
                    ${family.map(m => `<option value="${m}">${m}</option>`).join('')}
                  </select>
                </div>

                <div>
                  <label class="block text-xs font-semibold text-slate-300 mb-1">Mot de passe familial :</label>
                  <input type="password" id="passInput" placeholder="Entrez le mot de passe" required class="w-full bg-slate-800 border border-slate-700 text-slate-100 text-xs rounded-xl p-3 focus:outline-none focus:border-amber-500">
                </div>

                <button type="submit" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                  <i class="fa-solid fa-right-to-bracket"></i> Se connecter
                </button>
              </form>
            </div>
          </div>
        `;
        return;
      }

      const activeItems = items.filter(i => !i.deleted);

      const filteredItems = activeItems.filter(item => {
        let matchCategory = false;
        if (activeFilterCategory === 'Tous') {
          matchCategory = true;
        } else if (activeFilterCategory === 'DISPO_LATER') {
          matchCategory = item.availableLater;
        } else {
          matchCategory = (item.category === activeFilterCategory);
        }

        const matchMember = (activeFilterMember === 'Tous' || item.interests.includes(activeFilterMember));
        return matchCategory && matchMember;
      });

      const dispoLaterCount = activeItems.filter(i => i.availableLater).length;

      app.innerHTML = `
        <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 p-3 shadow-lg">
          <div class="max-w-[1600px] mx-auto flex flex-wrap justify-between items-center gap-3">
            <div>
              <h1 class="text-xl font-bold text-amber-400"><i class="fa-solid fa-boxes-packing mr-2"></i>Catalogue de Famille</h1>
              <p class="text-[11px] text-slate-400">${activeItems.length} objet(s) au total ${activeFilterMember !== 'Tous' || activeFilterCategory !== 'Tous' ? `— <b class="text-amber-300">${filteredItems.length} affiché(s)</b>` : ''}</p>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap">
              <div class="bg-slate-900 border border-amber-500/30 px-2.5 py-1 rounded-lg flex items-center gap-2">
                <i class="fa-solid fa-circle-user text-amber-400 text-xs"></i>
                <span class="text-xs font-semibold text-slate-200">${currentUser}</span>
                <button onclick="setCurrentUser(null)" title="Déconnexion" class="ml-1 text-[10px] text-slate-400 hover:text-rose-400 underline">Déconnexion</button>
              </div>

              ${activeItems.length > 0 ? `
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-2.5 py-1.5 rounded-lg text-xs transition flex items-center gap-1.5 shadow">
                  <i class="fa-solid fa-file-excel"></i>Extraire la synthèse
                </button>
              ` : ''}
            </div>
          </div>
        </header>

        <main class="max-w-[1600px] mx-auto p-3 space-y-4">
          <div class="bg-slate-800/80 p-3 rounded-xl border border-slate-700/80 flex flex-wrap items-center gap-2 shadow">
            <span class="text-[11px] font-bold text-amber-400 uppercase tracking-wider flex items-center gap-1">
              <i class="fa-solid fa-eye"></i> Consulter les choix de :
            </span>
            <button onclick="setMemberFilter('Tous')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition ${activeFilterMember === 'Tous' ? 'bg-amber-500 text-slate-900 shadow' : 'bg-slate-700 text-slate-300 hover:bg-slate-600'}">
              Voir tout le monde
            </button>
            ${family.map(f => {
              const count = activeItems.filter(i => i.interests.includes(f)).length;
              const isActive = activeFilterMember === f;
              const isChild = f.includes("enfant");
              return `
                <button onclick="setMemberFilter('${f}')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition flex items-center gap-1 ${isActive ? 'bg-emerald-500 text-slate-950 font-bold shadow' : 'bg-slate-700 text-slate-200 hover:bg-slate-600'} ${isChild ? 'border border-dashed border-amber-400/40' : ''}">
                  <span>${f}</span>
                  <span class="px-1.5 py-0.2 text-[10px] rounded-full ${isActive ? 'bg-slate-950/30 text-slate-950' : 'bg-slate-800 text-slate-400'}">${count}</span>
                </button>
              `;
            }).join('')}
          </div>

          <div class="flex flex-wrap items-center gap-1.5 pb-2 border-b border-slate-800">
            <span class="text-xs text-slate-400 font-semibold mr-1">Filtre :</span>
            <button onclick="setCategoryFilter('Tous')" class="px-2.5 py-1 rounded-full text-xs font-semibold ${activeFilterCategory === 'Tous' ? 'bg-amber-500 text-slate-900 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">Toutes</button>
            
            ${CATEGORIES.map(c => `
              <button onclick="setCategoryFilter('${c}')" class="px-2.5 py-1 rounded-full text-xs font-semibold ${activeFilterCategory === c ? 'bg-amber-500 text-slate-900 font-bold' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">${c}</button>
            `).join('')}

            <button onclick="setCategoryFilter('DISPO_LATER')" class="px-2.5 py-1 rounded-full text-xs font-semibold transition flex items-center gap-1 ${activeFilterCategory === 'DISPO_LATER' ? 'bg-yellow-300 text-slate-950 font-bold shadow' : 'bg-yellow-300/10 text-yellow-300 border border-yellow-300/30 hover:bg-yellow-300/20'}">
              <span>🟡 Aux Orchidées</span>
              <span class="px-1.5 py-0.2 text-[10px] rounded-full ${activeFilterCategory === 'DISPO_LATER' ? 'bg-slate-950/30 text-slate-950' : 'bg-yellow-300/20 text-yellow-300'}">${dispoLaterCount}</span>
            </button>
          </div>

          <!-- Affichage sur 5 colonnes en largeur -->
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3">
            ${filteredItems.map((item) => `
              <div class="bg-slate-800 rounded-lg overflow-hidden border border-slate-700/60 shadow flex flex-col relative group">
                <div class="relative aspect-square bg-slate-950/80 overflow-hidden cursor-pointer p-1" onclick="openLightboxByItem(${item.id})">
                  <img src="${item.url}" onerror="this.onerror=null; this.src='${item.fallbackUrl}'; this.onerror=function(){this.src='${item.fallbackUrl2}'; this.onerror=function(){this.src='${item.fallbackUrl3}';};};" class="w-full h-full object-contain group-hover:scale-105 transition duration-300" loading="lazy">
                  
                  ${item.availableLater ? `
                    <div class="absolute top-2 right-2 z-10 flex items-center justify-center" title="Aux Orchidées">
                      <span class="relative flex h-10 w-10">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-300 opacity-80"></span>
                        <span class="relative inline-flex rounded-full h-10 w-10 bg-yellow-300 border-2 border-slate-950 shadow-[0_0_15px_#fde047]"></span>
                      </span>
                    </div>
                  ` : ''}
                </div>

                <div class="p-2.5 flex-1 flex flex-col justify-between space-y-2">
                  <div>
                    <div class="flex justify-between items-center gap-1 mb-1.5">
                      <span class="text-[11px] font-semibold text-amber-400 bg-amber-400/10 border border-amber-400/20 px-1.5 py-0.5 rounded truncate">${item.category}</span>
                      
                      <div class="flex items-center gap-1 flex-wrap justify-end">
                        ${currentUser === "Thierry" ? `
                          <button 
                            onclick="toggleAvailableLater(${item.id})" 
                            class="text-[9px] font-bold px-1 py-0.5 rounded transition flex items-center gap-1 border ${
                              item.availableLater 
                                ? 'bg-rose-600 hover:bg-rose-500 text-white border-rose-500 shadow' 
                                : 'bg-slate-700/60 hover:bg-rose-600 hover:text-white text-slate-300 border-slate-600/50'
                            }"
                            title="Indiquer Aux Orchidées"
                          >
                            <i class="fa-solid fa-clock"></i>
                            <span>Aux Orchidées</span>
                          </button>

                          <button 
                            onclick="openCategoryModal(${item.id})" 
                            class="bg-slate-700/80 hover:bg-amber-500 hover:text-slate-950 text-slate-300 text-[9px] font-medium px-1 py-0.5 rounded transition flex items-center gap-1 border border-slate-600/50"
                            title="Changer la catégorie"
                          >
                            <i class="fa-solid fa-pen-to-square"></i>
                            <span>Changer</span>
                          </button>

                          <button 
                            onclick="deleteItem(${item.id})" 
                            class="text-[9px] font-bold px-1 py-0.5 rounded transition flex items-center gap-1 bg-red-600/80 hover:bg-red-600 text-white border border-red-500 shadow"
                            title="Supprimer définitivement cet objet"
                          >
                            <i class="fa-solid fa-trash-can"></i>
                            <span>Suppr.</span>
                          </button>
                        ` : ''}
                      </div>
                    </div>
                    <p class="text-[11px] text-slate-400 font-mono truncate" title="${item.name}">${item.name}</p>
                  </div>

                  <div class="space-y-1 border-t border-slate-700/50 pt-1.5">
                    <p class="text-[9px] uppercase tracking-wider text-slate-400 font-bold">Intéressé(e)s :</p>
                    <div class="flex flex-wrap gap-1">
                      ${family.map(m => {
                        const interested = item.interests.includes(m);
                        const hasPermission = canControl(m);
                        
                        return `
                          <button 
                            ${hasPermission ? `onclick="toggleInterest(${item.id}, '${m}')"` : 'disabled'} 
                            class="text-[10px] px-1.5 py-0.5 rounded transition flex items-center gap-0.5 ${
                              interested 
                                ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 font-semibold' 
                                : 'bg-slate-700/30 text-slate-500 border border-transparent'
                            } ${
                              hasPermission 
                                ? 'cursor-pointer ring-1 ring-amber-400/50 hover:bg-emerald-500/30' 
                                : 'cursor-not-allowed opacity-50'
                            }"
                          >
                            ${interested ? '✓ ' : ''}${m}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </main>

        <!-- Modale Catégorie (Réservée à Thierry) -->
        ${editingCategoryItemId !== null && currentUser === "Thierry" ? `
          <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4" onclick="closeCategoryModal()">
            <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl" onclick="event.stopPropagation()">
              <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                  <i class="fa-solid fa-list"></i> Changer de catégorie
                </h3>
                <button onclick="closeCategoryModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
              </div>
              <div class="grid grid-cols-1 gap-2">
                ${CATEGORIES.map(c => `
                  <button onclick="selectCategory('${c}')" class="w-full text-left px-3 py-2 rounded-lg bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs font-semibold transition border border-slate-700/60 flex items-center justify-between">
                    <span>${c}</span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        ` : ''}

        <!-- Lightbox -->
        ${lightboxIndex !== null && items[lightboxIndex] ? `
          <div class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-4" onclick="closeLightbox()">
            <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center justify-center" onclick="event.stopPropagation()">
              <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white text-2xl hover:text-amber-400"><i class="fa-solid fa-xmark"></i></button>
              <img src="${items[lightboxIndex].url}" onerror="this.onerror=null; this.src='${items[lightboxIndex].fallbackUrl}';" class="max-h-[80vh] max-w-full object-contain rounded-lg">
              <p class="text-slate-300 text-sm mt-3 font-medium">${items[lightboxIndex].name} — <span class="text-amber-400">${items[lightboxIndex].category}</span></p>
            </div>
          </div>
        ` : ''}
      `;
    }

    function setCurrentUser(user) { currentUser = user; render(); }
    function setCategoryFilter(cat) { activeFilterCategory = cat; render(); }
    function setMemberFilter(member) { activeFilterMember = member; render(); }

    function openLightboxByItem(id) { lightboxIndex = items.findIndex(i => i.id === id); render(); }
    function closeLightbox() { lightboxIndex = null; render(); }

    function exportCSV() {
      const activeItems = items.filter(i => !i.deleted);
      if (activeItems.length === 0) return alert("Aucun objet à exporter.");
      
      let headers = ["Nom de l'objet", "Catégorie", "Aux Orchidées", "Nombre d'intéressés", ...family];
      let csvContent = "\uFEFF" + headers.map(h => `"${h}"`).join(";") + "\n";
      
      activeItems.forEach(item => {
        const dispoStr = item.availableLater ? "Oui" : "Non";
        
        let row = [
          `"${item.name.replace(/"/g, '""')}"`,
          `"${item.category.replace(/"/g, '""')}"`,
          `"${dispoStr}"`,
          item.interests.length
        ];

        family.forEach(member => {
          const isInterested = item.interests.includes(member) ? "Oui" : "";
          row.push(`"${isInterested}"`);
        });

        csvContent += row.join(";") + "\n";
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `synthese_inventaire_famille_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    buildInventory();
    initRealtimeSync();
    render();
  </script>
</body>
</html>
